<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LLM Clarification Plugin fixture</title><style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#172033}textarea,[contenteditable]{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:150px}button{padding:9px 14px;border:0;border-radius:7px;background:#172033;color:#fff;cursor:pointer}#log{margin-top:24px;padding:12px;background:#f1f5f9;white-space:pre-wrap;border-radius:7px}</style></head>
<body><h1>Plugin test fixture</h1><p>Load the <code>extension/</code> directory unpacked, then open this file. The plugin should insert its instruction into the empty composer once. Delete it to test the user bypass path.</p>
<form id="fixture-form"><label for="prompt">Composer</label><textarea id="prompt" placeholder="The plugin should fill this when the page loads"></textarea><button type="submit" aria-label="Send">Send</button></form>
<h2>Contenteditable test</h2><div id="editable" contenteditable="true" role="textbox"></div><button id="editable-send" aria-label="Send">Send contenteditable</button>
<pre id="log">No submission yet.</pre>
<script>const log=document.querySelector('#log');let count=0;document.querySelector('#fixture-form').addEventListener('submit',e=>{e.preventDefault();count++;log.textContent=`Host submit handler ran (#${count}).\nPrompt:\n${document.querySelector('#prompt').value}`});document.querySelector('#editable-send').addEventListener('click',()=>{count++;log.textContent=`Contenteditable host handler ran (#${count}).\nPrompt:\n${document.querySelector('#editable').innerText}`});</script>
</body></html>
