<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clarification Plugin</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <h1>Clarification Plugin</h1>
    <p>Insert an editable clarification instruction at the start of each new chat.</p>
    <label class="switch"><input id="enabled" type="checkbox" checked><span>Enable automatic instruction</span></label>
    <button id="options">Edit instruction and settings</button>
    <p class="hint">The instruction is added to an empty composer once. Delete it whenever you want to send without it.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
